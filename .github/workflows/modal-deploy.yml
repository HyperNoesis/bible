name: Deploy GPU export (Modal)
# Needs three repo secrets (Settings -> Secrets and variables -> Actions): MODAL_TOKEN_ID, MODAL_TOKEN_SECRET, GENESIS_EXPORT_TOKEN.
# Optional repo VARIABLES: ALLOW_ORIGIN (your site origin, e.g. https://hypernoesis.github.io), DAILY_CAP (default 30), GENESIS_GPU (default L4), GENESIS_INCLUDE_REFERENCE (default 1; 0 = leave MatAnyone 2 out), ALLOW_REFERENCE (default 0).
# Without the secrets this workflow does nothing (it prints a notice).
on:
  workflow_dispatch:
    inputs:
      gpu: { description: 'GPU type (L4, L40S, A10, ...)', default: '' }
  push:
    branches: [main]
    paths: ['gpu/**', 'server/studio-export/**', 'assets/environments/**', '.github/workflows/modal-deploy.yml']
concurrency: { group: modal-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GENESIS_EXPORT_TOKEN: ${{ secrets.GENESIS_EXPORT_TOKEN }}
      ALLOW_ORIGIN: ${{ vars.ALLOW_ORIGIN }}
      DAILY_CAP: ${{ vars.DAILY_CAP }}
      ALLOW_REFERENCE: ${{ vars.ALLOW_REFERENCE }}
      GENESIS_GPU: ${{ inputs.gpu || vars.GENESIS_GPU || 'L4' }}
      GENESIS_INCLUDE_REFERENCE: ${{ vars.GENESIS_INCLUDE_REFERENCE || '1' }}
    steps:
      - name: Check secrets
        id: chk
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ] || [ -z "$GENESIS_EXPORT_TOKEN" ]; then
            echo "::notice::Modal secrets are not set yet, skipping. See docs/DEPLOY_FROM_PHONE.md"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.ok == 'true'
        with: { python-version: '3.11' }
      - name: Install Modal
        if: steps.chk.outputs.ok == 'true'
        run: pip install -q modal
      - name: Create or update the access secret on Modal
        if: steps.chk.outputs.ok == 'true'
        run: |
          modal secret create genesis-export --force \
            GENESIS_EXPORT_TOKEN="$GENESIS_EXPORT_TOKEN" \
            ALLOW_ORIGIN="${ALLOW_ORIGIN:-*}" \
            DAILY_CAP="${DAILY_CAP:-30}" \
            ALLOW_REFERENCE="${ALLOW_REFERENCE:-0}"
      - name: Deploy (first build downloads about 3 GB of models and takes 10-20 minutes)
        if: steps.chk.outputs.ok == 'true'
        run: |
          modal deploy gpu/modal_app.py 2>&1 | tee deploy.log
          url=$(grep -o 'https://[^ ]*modal.run' deploy.log | head -1)
          echo "::notice title=Studio Export URL::$url"
          { echo "### Studio Export is deployed"; echo; echo "URL for js/config.js renderRelayUrl: \`$url\`"; echo; echo "Health check: $url/health"; } >> "$GITHUB_STEP_SUMMARY"
