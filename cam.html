<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis Camera</title><link rel="icon" href="assets/logo.png"><meta name="theme-color" content="#0B0E14">
<link rel="stylesheet" href="css/genesis-system.css">
</head><body class="cmp">
<header class="cmp-head"><img src="assets/logo.png" alt=""><div><h1>Genesis Camera</h1><small>Use this phone as a camera</small></div></header>
<div id="st" role="status" aria-live="polite">Starting…</div>
<video id="v" autoplay muted playsinline></video>
<div class="stack"><button class="big" id="bStart" style="display:block;width:100%">Start camera</button>
<button id="bFlip" disabled>Switch front or back camera</button>
<button id="bStop" disabled>Stop camera</button></div>
<p class="info">Only video is sent, straight to your studio. Keep this screen on. The same Wi-Fi network gives the best result.</p>
<script src="js/config.js"></script><script src="js/prompter-core.js"></script><script src="js/multisource-core.js"></script><script src="js/cam.js"></script>
<script src="js/genesis-design.js"></script>
</body></html>
