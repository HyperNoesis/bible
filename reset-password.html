<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset your password, Genesis</title>
<link rel="icon" href="assets/logo.png"><link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/genesis-system.css">
</head>
<body class="g-app">
<a class="g-skip" href="#main">Skip to main content</a>
<div class="e-auth">
  <aside class="e-auth-visual" style="background-image:url(assets/environments/scene-premium-library.jpg)" aria-hidden="true">
    <div><h2>Set a new password.</h2><p>Choose something you will remember. You will use it to sign in on any device.</p></div>
  </aside>
  <main class="e-auth-main" id="main">
    <div class="e-auth-card">
      <a class="e-brand" href="landing.html" aria-label="Genesis home"><img src="assets/logo-mark.png" alt="">Genesis</a>
      <h1>Choose a new password</h1>
      <form id="resetForm">
        <div class="g-field"><label for="rpPassword">New password</label><input class="g-input" type="password" id="rpPassword" placeholder="At least 6 characters" autocomplete="new-password" required></div>
        <div class="g-field"><label for="rpPassword2">Confirm new password</label><input class="g-input" type="password" id="rpPassword2" placeholder="Type it again" autocomplete="new-password" required></div>
        <div class="g-error" id="rpError" role="alert"></div>
        <div class="g-alert g-alert--ok" id="rpNotice" style="display:none;" role="status"></div>
        <button type="submit" class="g-btn g-btn--primary">Set new password</button>
      </form>
      <p class="e-small"><a href="auth.html">Back to sign in</a></p>
    </div>
  </main>
</div>
  <script src="js/error-boundary.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-loader.js"></script>
  <script src="js/providers/auth-provider.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const resetForm = document.getElementById('resetForm');
    const errorEl = document.getElementById('rpError');
    const noticeEl = document.getElementById('rpNotice');

    if (window.VS.auth.mode !== 'supabase') {
      errorEl.textContent = 'Password reset links only work with cloud accounts. This device is using local-only accounts, so there is nothing to reset here.';
      resetForm.querySelector('button').disabled = true;
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = ''; noticeEl.style.display = 'none';
      const p1 = document.getElementById('rpPassword').value;
      const p2 = document.getElementById('rpPassword2').value;
      if (p1.length < 6) { errorEl.textContent = 'Use at least 6 characters.'; return; }
      if (p1 !== p2) { errorEl.textContent = 'The two passwords do not match.'; return; }
      const btn = resetForm.querySelector('button');
      btn.disabled = true; btn.textContent = 'Please wait';
      try {
        // Supabase's reset-link redirect already establishes a temporary
        // recovery session from the URL — updatePassword() just needs to
        // call auth.updateUser(), same as a normal password change.
        await window.VS.auth.updatePassword(p1);
        noticeEl.textContent = 'Password updated. Taking you to sign in.';
        noticeEl.style.display = 'block';
        setTimeout(() => { window.location.href = 'auth.html'; }, 1500);
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Set new password';
      }
    });
  </script>
<script src="js/genesis-design.js"></script>
</body>
</html>
